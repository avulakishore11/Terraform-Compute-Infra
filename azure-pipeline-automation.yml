###############################################################################
# VM Automation Pipeline — Logic App only
# Deploys only the resources needed to automate VM startup/shutdown:
#   • Resource Group
#   • Networking (VNet + Logic App subnet + NSGs)
#   • User Assigned Managed Identity (UAMI)
#   • Monitoring (Log Analytics + App Insights)
#   • Logic App Standard + App Service Plan
#   • logicapp-state container in backend storage
#   • RBAC: UAMI → Virtual Machine Contributor on the automation VM
#
# Trigger: manual only — run this before the full infra pipeline when you
# only need the Logic App automation stack.
###############################################################################

trigger: none

parameters:
- name: environment
  displayName: 'Target environment'
  type: string
  default: dev
  values:
  - dev
  - uat
  - prod

pool:
  vmImage: ubuntu-latest

variables:
- name: serviceConnection
  value: 'Azure-to-ADO-svc-connection'
- name: backendResourceGroup
  value: 'rgeus-tftest-01'
- name: backendStorageAccount
  value: 'terrastatesa'
- name: backendContainer
  value: 'tfstate'
- name: stateKey
  value: '${{ parameters.environment }}/terraform.tfstate'
- name: varFile
  value: 'environments/automation.tfvars'

stages:

- stage: Validate
  displayName: 'Validate'
  jobs:
  - job: StaticChecks
    displayName: 'Validate and Security Scan'
    steps:

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        terraform init -backend=false
        terraform validate
      displayName: 'Terraform Validate'

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy config . --exit-code 0
      displayName: 'Trivy Security Scan'

- stage: DeployAutomation
  displayName: 'Deploy Automation Stack (${{ parameters.environment }})'
  dependsOn: Validate
  condition: succeeded('Validate')
  jobs:
  - deployment: TerraformAutomation
    displayName: 'Terraform — Automation only'
    environment: '${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: $(stateKey)

          - task: TerraformTaskV4@4
            displayName: 'Plan (automation resources only)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: >-
                -var-file=$(varFile)
                -out=tfplan-automation
                -target=module.resource_group
                -target=module.networking
                -target=module.identity
                -target=module.monitoring
                -target=module.logic_app
                -target=azurerm_storage_container.logicapp_state
                -target=azurerm_role_assignment.uami_vm_contributor
                -target=azurerm_role_assignment.uami_storage_blob
              environmentServiceNameAzureRM: $(serviceConnection)
            env:
              TF_VAR_subscription_id: $(subscription_id)
              TF_VAR_vm_admin_password: $(vm_admin_password)

          - task: TerraformTaskV4@4
            displayName: 'Apply (automation resources only)'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-auto-approve tfplan-automation'
              environmentServiceNameAzureRM: $(serviceConnection)
