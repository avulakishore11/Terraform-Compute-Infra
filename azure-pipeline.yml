trigger:
  branches:
    include:
      - test/feature-branch
    exclude:
      - feature/updated-with-all-code

pool:
  vmImage: ubuntu-latest

# ── Pipeline variables ────────────────────────────────────────────────────────
# admin_password: Add this as a SECRET variable in Azure DevOps UI
#   Pipeline → Edit → Variables → add "admin_password" and lock it.
# ─────────────────────────────────────────────────────────────────────────────
variables:
- name: serviceConnection
  value: 'Azure-to-ADO-svc-connection'
- name: backendResourceGroup
  value: 'rgeus-tftest-01'
- name: backendStorageAccount
  value: 'terrastatesa'
- name: backendContainer
  value: 'tfstate'
- name: stateKey
  value: 'dev/terraform.tfstate'
- name: varFile
  value: 'environments/dev.tfvars'

stages:

# ── STAGE 1: VALIDATE ────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Validate'
  jobs:
  - job: StaticChecks
    displayName: 'Lint and Security Scan'
    steps:

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        terraform init -backend=false
        terraform validate
      displayName: 'Terraform Validate'

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
        trivy config . --exit-code 0
      displayName: 'Trivy Security Scan'

# ── STAGE 2: DEV ─────────────────────────────────────────────────────────────
- stage: Dev
  displayName: 'Deploy to Dev'
  dependsOn: Validate
  condition: and(succeeded('Validate'), ne(variables['ENABLE_DESTROY'], 'true'))
  jobs:
  - job: TerraformDev
    displayName: 'Terraform Dev'
    steps:

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Init (Dev)'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: $(serviceConnection)
        backendAzureRmResourceGroupName: $(backendResourceGroup)
        backendAzureRmStorageAccountName: $(backendStorageAccount)
        backendAzureRmContainerName: $(backendContainer)
        backendAzureRmKey: $(stateKey)

    - task: TerraformTaskV4@4
      displayName: 'Plan (Dev)'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        commandOptions: '-var-file=$(varFile) -out=tfplan-dev'
        environmentServiceNameAzureRM: $(serviceConnection)
      env:
        TF_VAR_admin_password: $(admin_password)

    - task: TerraformTaskV4@4
      displayName: 'Apply (Dev)'
      inputs:
        provider: 'azurerm'
        command: 'apply'
        commandOptions: '-auto-approve tfplan-dev'
        environmentServiceNameAzureRM: $(serviceConnection)

# ── STAGE 3: UAT ─────────────────────────────────────────────────────────────
- stage: UAT
  displayName: 'Deploy to UAT'
  dependsOn: Dev
  condition: and(succeeded('Dev'), ne(variables['ENABLE_DESTROY'], 'true'))
  variables:
    varFile: 'environments/uat.tfvars'
    stateKey: 'uat/terraform.tfstate'
  jobs:
  - deployment: TerraformUAT
    displayName: 'Terraform UAT'
    environment: 'uat'
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Init (UAT)'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: $(stateKey)

          - task: TerraformTaskV4@4
            displayName: 'Plan (UAT)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-var-file=$(varFile) -out=tfplan-uat'
              environmentServiceNameAzureRM: $(serviceConnection)
            env:
              TF_VAR_admin_password: $(admin_password)

          - task: TerraformTaskV4@4
            displayName: 'Apply (UAT)'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-auto-approve tfplan-uat'
              environmentServiceNameAzureRM: $(serviceConnection)

# ── STAGE 4: PROD ────────────────────────────────────────────────────────────
- stage: Prod
  displayName: 'Deploy to Prod'
  dependsOn: UAT
  condition: and(succeeded('UAT'), ne(variables['ENABLE_DESTROY'], 'true'))
  variables:
    varFile: 'environments/prod.tfvars'
    stateKey: 'prod/terraform.tfstate'
  jobs:
  - deployment: TerraformProd
    displayName: 'Terraform Prod'
    environment: 'prod'
    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: 'latest'

          - task: TerraformTaskV4@4
            displayName: 'Init (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: $(serviceConnection)
              backendAzureRmResourceGroupName: $(backendResourceGroup)
              backendAzureRmStorageAccountName: $(backendStorageAccount)
              backendAzureRmContainerName: $(backendContainer)
              backendAzureRmKey: $(stateKey)

          - task: TerraformTaskV4@4
            displayName: 'Plan (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              commandOptions: '-var-file=$(varFile) -out=tfplan-prod'
              environmentServiceNameAzureRM: $(serviceConnection)
            env:
              TF_VAR_admin_password: $(admin_password)

          - task: TerraformTaskV4@4
            displayName: 'Apply (Prod)'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              commandOptions: '-auto-approve tfplan-prod'
              environmentServiceNameAzureRM: $(serviceConnection)

# ── STAGE 5: DESTROY ─────────────────────────────────────────────────────────
# Trigger: queue pipeline manually with variable ENABLE_DESTROY=true
# Two gates: the variable flag + ManualValidation approval
# ─────────────────────────────────────────────────────────────────────────────
- stage: Destroy
  displayName: 'Destroy Infrastructure'
  dependsOn: Validate
  condition: and(succeeded('Validate'), eq(variables['ENABLE_DESTROY'], 'true'))
  jobs:

  - job: ApproveDestroy
    displayName: 'Manual Approval Gate'
    pool: server
    timeoutInMinutes: 60
    steps:
    - task: ManualValidation@0
      displayName: 'Confirm Destroy'
      inputs:
        instructions: |
          WARNING: This will permanently delete all infrastructure in $(varFile).
          Click Resume to proceed, or Reject to abort.
        onTimeout: 'reject'
        timeoutInMinutes: 60

  - job: TerraformDestroy
    displayName: 'Terraform Destroy'
    dependsOn: ApproveDestroy
    pool:
      vmImage: ubuntu-latest
    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - task: TerraformTaskV4@4
      displayName: 'Init (Destroy)'
      inputs:
        provider: 'azurerm'
        command: 'init'
        backendServiceArm: $(serviceConnection)
        backendAzureRmResourceGroupName: $(backendResourceGroup)
        backendAzureRmStorageAccountName: $(backendStorageAccount)
        backendAzureRmContainerName: $(backendContainer)
        backendAzureRmKey: $(stateKey)

    - task: TerraformTaskV4@4
      displayName: 'Destroy'
      inputs:
        provider: 'azurerm'
        command: 'destroy'
        commandOptions: '-auto-approve -var-file=$(varFile)'
      env:
        TF_VAR_admin_password: $(admin_password)
        environmentServiceNameAzureRM: $(serviceConnection)
